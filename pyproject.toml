[project]
name = "mojo-httptools"
version = "0.1.0"
description = "HTTP/1 request parsing implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "http", "parser", "httptools"]

[project.optional-dependencies]
dev = ["pytest", "httptools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
